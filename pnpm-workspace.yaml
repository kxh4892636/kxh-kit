packages:
  - apps/*
  - templates/*
  - packages/*

allowBuilds:
  "@bufbuild/buf": true
  "@swc/core": false
  core-js: false
  esbuild: false

catalog:
  "@ant-design/cssinjs": ^2.1.2
  "@ant-design/icons": ^6.2.5
  "@connectrpc/connect": ^2.1.1
  "@fontsource-variable/geist": ^5.2.9
  "@hono/node-server": ^2.0.4
  "@hono/zod-validator": ^0.8.0
  "@libsql/client": ^0.17.3
  "@tailwindcss/vite": ^4.2.4
  "@tanstack/react-query": ^5.100.8
  "@tanstack/react-router": ^1.169.1
  "@types/node": ^24
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  # TypeScript 7 provides tsc; TypeScript 6 remains under the canonical package name
  # for tools that still import the legacy compiler API.
  "@typescript/native": npm:typescript@~7.0.2
  antd: ^6.4.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dayjs: ^1.11.13
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  es-toolkit: ^1.46.1
  hono: 4.12.23
  lucide-react: ^1.16.0
  radix-ui: ^1.4.3
  react: ^19.2.5
  react-dom: ^19.2.5
  shadcn: ^4.7.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.2.4
  tsdown: ^0.22.1
  tsx: ^4.22.3
  tw-animate-css: ^1.4.0
  typescript: npm:@typescript/typescript6@~6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: latest
  zod: ^4.4.3
  zustand: ^5.0.12

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

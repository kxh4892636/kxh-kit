packages:
  - apps/*
  - packages/*

allowBuilds:
  "@bufbuild/buf": true
  "@swc/core": false
  core-js: false
  electron: true
  esbuild: false

catalog:
  "@types/node": ^24.12.4
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  # TypeScript 7 provides tsc; TypeScript 6 remains under the canonical package name
  # for tools that still import the legacy compiler API.
  "@typescript/native": npm:typescript@~7.0.2
  c8: 12.0.0
  react: ^19.2.5
  react-dom: ^19.2.5
  typescript: npm:@typescript/typescript6@~6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  vitest: ^4.1.10

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

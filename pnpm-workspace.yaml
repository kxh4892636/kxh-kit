packages:
  - apps/*
  - packages/*

allowBuilds:
  # v13 自带原生预编译文件，避免 pnpm 隐式触发 node-gyp。
  better-sqlite3: false
  "@bufbuild/buf": true
  "@google/genai": false
  "@swc/core": false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: false
  protobufjs: false

catalog:
  hono: 4.13.7
  "@hono/node-server": 2.1.1
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  better-sqlite3: 13.0.3
  zod: 4.5.4
  "@tanstack/react-virtual": ^3.14.10
  "@types/node": ^24.12.4
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@vitest/coverage-v8": ^4.1.10
  # TypeScript 7 provides tsc; TypeScript 6 remains under the canonical package name
  # for tools that still import the legacy compiler API.
  "@typescript/native": npm:typescript@~7.0.2
  c8: 12.0.0
  electron-builder: ^26.15.3
  react: ^19.2.5
  react-dom: ^19.2.5
  typescript: npm:@typescript/typescript6@~6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  vitest: ^4.1.10
  yaml: ^2.9.0

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # app-builder-lib 26.15.3 引用了 @electron/get 3.1.0 才新增的 ElectronDownloadCacheMode,
  # 而 lockfile 曾把其锁在 3.0.0 导致打包崩溃; 作用域覆盖只影响 app-builder-lib
  "app-builder-lib>@electron/get": ^3.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

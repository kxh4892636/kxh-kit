<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ec" />
    <title>今天，顺风。 · 鹈鹕的海边骑行</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f5ec;
        --ink: #304c45;
        --muted: #7e8a7c;
        --orange: #df704b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 5px;
      }
      .page {
        max-width: 1280px;
        margin: auto;
        padding: 0 52px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 104px;
        border-bottom: 1px solid #304c4519;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
      }
      .brand-name {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 3px;
      }
      .brand-caption {
        margin-top: 5px;
        font-size: 8px;
        letter-spacing: 2px;
        color: var(--muted);
      }
      .weather {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #728170;
      }
      .weather svg {
        width: 21px;
        height: 21px;
        color: #c59050;
      }
      .intro {
        text-align: center;
        padding-top: 37px;
        position: relative;
        z-index: 1;
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 10px;
        letter-spacing: 4px;
        color: #a27f60;
      }
      h1 {
        margin: 0;
        font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
        font-size: clamp(38px, 5vw, 59px);
        font-weight: 500;
        letter-spacing: 8px;
      }
      .intro p:last-child {
        margin: 18px 0 0;
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--muted);
      }
      .scene {
        position: relative;
        height: clamp(330px, 39vw, 460px);
        margin: -7px -25px 0;
        overflow: hidden;
      }
      .landscape {
        position: absolute;
        height: 100%;
        min-width: 100%;
        width: auto;
        left: 50%;
        transform: translateX(-50%);
        overflow: visible;
      }
      .controls {
        width: fit-content;
        margin: 5px auto 0;
        padding: 16px 22px 16px 17px;
        display: flex;
        align-items: center;
        gap: 22px;
        background: #fffdf6;
        border: 1px solid #e6e7db;
        border-radius: 20px;
        box-shadow: 0 7px 22px #48523b05;
      }
      .play {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: var(--ink);
        color: #fffdf6;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .play:hover {
        background: #49675b;
        transform: scale(1.04);
      }
      .play svg {
        width: 17px;
        height: 17px;
      }
      .play-icon,
      .paused .pause-icon {
        display: none;
      }
      .paused .play-icon {
        display: block;
      }
      .ride-info {
        min-width: 86px;
        margin-left: -10px;
      }
      .ride-info strong {
        display: block;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 1px;
      }
      .ride-info span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 1px;
      }
      .divider {
        width: 1px;
        height: 29px;
        background: #e3e6db;
      }
      .speed-control {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .speed-control label {
        font-size: 11px;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100px;
        height: 4px;
        appearance: none;
        border-radius: 4px;
        background: #dfe5d6;
        accent-color: var(--ink);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        height: 13px;
        width: 13px;
        border-radius: 50%;
        background: var(--ink);
        border: 3px solid #fffdf6;
        box-shadow: 0 0 0 1px var(--ink);
      }
      input[type="range"]::-moz-range-thumb {
        height: 8px;
        width: 8px;
        border-radius: 50%;
        background: var(--ink);
        border: 3px solid #fffdf6;
        box-shadow: 0 0 0 1px var(--ink);
      }
      output {
        min-width: 37px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .restart {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 0;
        padding: 5px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .restart:hover {
        color: var(--orange);
      }
      .restart svg {
        width: 18px;
        height: 18px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 31px 0 25px;
        color: #8b9486;
        font-size: 10px;
        letter-spacing: 1px;
      }
      .edition {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 9px;
        letter-spacing: 2px;
      }
      .edition::before {
        content: "";
        width: 5px;
        height: 5px;
        background: #dd9673;
        border-radius: 50%;
      }
      .key-hint {
        text-align: center;
        margin: 13px 0 0;
        color: #a0a697;
        font-size: 9px;
        letter-spacing: 1px;
      }
      @media (max-width: 640px) {
        .page {
          padding: 0 23px;
        }
        header {
          height: 83px;
        }
        .brand-name {
          font-size: 12px;
          letter-spacing: 2px;
        }
        .brand-caption {
          font-size: 6px;
          letter-spacing: 1.5px;
        }
        .brand-mark {
          width: 34px;
          height: 34px;
        }
        .weather {
          font-size: 9px;
          letter-spacing: 0;
          gap: 5px;
        }
        .weather svg {
          width: 17px;
        }
        .intro {
          padding-top: 34px;
        }
        h1 {
          letter-spacing: 5px;
        }
        .intro p:last-child {
          font-size: 10px;
          letter-spacing: 1px;
        }
        .scene {
          margin: 9px -23px 0;
          height: 340px;
        }
        .controls {
          padding: 13px;
          gap: 13px;
          border-radius: 17px;
        }
        .ride-info {
          min-width: 63px;
          margin-left: -3px;
        }
        .speed-control {
          gap: 8px;
        }
        .speed-control label,
        .restart,
        .key-hint {
          display: none;
        }
        input[type="range"] {
          width: 74px;
        }
        footer {
          justify-content: center;
          padding-top: 27px;
          font-size: 9px;
        }
        .edition {
          display: none;
        }
      }
      @media (max-width: 360px) {
        .controls {
          gap: 10px;
          padding: 12px;
        }
        .ride-info {
          min-width: 65px;
        }
        .ride-info strong {
          font-size: 10px;
        }
        .play {
          width: 40px;
          height: 40px;
        }
        input[type="range"] {
          width: 58px;
        }
        output {
          min-width: 32px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .play {
          transition: none;
        }
      }
    </style>
  </head>

                  fill="none"
                  stroke="#425b50"
                  stroke-width="5"
                />
                <path d="M599 81q10-14 23-15" fill="none" stroke="#b6c6a2" stroke-width="3" />
              </g>
            </g>
            <g id="breeze" fill="none" stroke="#b1ba9f" stroke-width="2" stroke-linecap="round">
              <path d="M376 235h42m-61 15h31m-5 62h39" />
            </g>
            <g fill="#9aa58f" font-family="Georgia, serif" font-size="12" font-style="italic">
              <text x="91" y="312" transform="rotate(-6 91 312)">a little sea breeze</text>
              <path
                d="M187 309q21 3 36 17m-7-13 7 13-15-3"
                fill="none"
                stroke="#aeb59d"
                stroke-width="1"
              />
            </g>
          </svg>
        </div>
        <div class="controls" role="group" aria-label="骑行动画控制">
          <button
            class="play"
            id="play-button"
            type="button"
            aria-label="暂停动画"
            title="暂停 / 继续（空格）"
          >
            <svg class="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <rect x="5" y="4" width="3" height="12" rx="1" />
              <rect x="12" y="4" width="3" height="12" rx="1" />
            </svg>
            <svg class="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M6 3.5 17 10 6 16.5Z" />
            </svg>
          </button>
          <div class="ride-info">
            <strong id="ride-status" aria-live="polite">自在骑行中</strong><span>海风刚刚好</span>
          </div>
          <div class="divider" aria-hidden="true"></div>
          <div class="speed-control">
            <label for="speed">骑行速度</label
            ><input
              id="speed"
              type="range"
              min="0.5"
              max="2"
              step="0.1"
              value="1"
              aria-label="骑行速度"
            /><output id="speed-value" for="speed">1.0×</output>
          </div>
          <button
            class="restart"
            id="restart-button"
            type="button"
            aria-label="重新开始动画"
            title="重新出发"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 10a8 8 0 1 1 .7 6M4 4v6h6" />
            </svg>
          </button>
        </div>
        <p class="key-hint">按下空格，让时间歇一会儿</p>
        <noscript><p class="key-hint">启用 JavaScript 后，鹈鹕就会开始骑行。</p></noscript>
      </main>
      <footer>
        <span>一只鹈鹕，一辆单车，一整个好天气。</span
        ><span class="edition">COASTAL DIARIES &nbsp; / &nbsp; 001</span>
      </footer>
    </div>
    <script>
      const byId = (id) => document.getElementById(id);
      const parts = Object.fromEntries(
        [
          "rear-spokes",
          "front-spokes",
          "crank",
          "pelican",
          "near-leg-path",
          "near-leg-highlight",
          "far-leg-path",
          "near-foot",
          "far-foot",
          "road-marks",
          "clouds",
          "sea-ripples",
          "sailboat",
          "scarf-tail",
          "eye",
          "breeze",
          "bike-shadow",
        ].map((id) => [id, byId(id)]),
      );
      const playButton = byId("play-button");
      const speedInput = byId("speed");
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
      let playing = !motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;
      const transform = (id, value) => parts[id].setAttribute("transform", value);
      // 两段等长腿用逆运动学求关节，让脚始终踩在水平踏板上。
      const legPath = (hipX, hipY, footX, footY) => {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.hypot(dx, dy);
        const bend = Math.sqrt(Math.max(0, 99 ** 2 - (distance / 2) ** 2));
        const kneeX = (hipX + footX) / 2 - (dy / distance) * bend;
        const kneeY = (hipY + footY) / 2 + (dx / distance) * bend;
        return `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY}`;
      };
      const render = () => {
        const phase = elapsed * Math.PI * 1.25;
        const degrees = (phase * 180) / Math.PI;
        const bob = Math.sin(phase * 2) * 2;
        const footX = 570 + Math.cos(phase) * 34;
        const footY = 412 + Math.sin(phase) * 34;
        const nearLeg = legPath(552, 257 + bob, footX, footY);
        parts["near-leg-path"].setAttribute("d", nearLeg);
        parts["near-leg-highlight"].setAttribute("d", nearLeg);
        parts["far-leg-path"].setAttribute("d", legPath(541, 260 + bob, 1140 - footX, 824 - footY));
        transform("near-foot", `translate(${footX} ${footY})`);
        transform("far-foot", `translate(${1140 - footX} ${824 - footY})`);
        transform("crank", `rotate(${degrees % 360} 570 412)`);
        transform("rear-spokes", `rotate(${(degrees * 1.65) % 360})`);
        transform("front-spokes", `rotate(${(degrees * 1.65) % 360})`);
        transform("pelican", `translate(0 ${bob})`);
        transform("scarf-tail", `rotate(${Math.sin(phase * 2 + 0.6) * 5} 600 187)`);
        transform("road-marks", `translate(${-((phase * 91 * 1.65) % 240)} 0)`);
        transform("clouds", `translate(${Math.sin(elapsed * 0.12) * 18} 0)`);
        transform("sea-ripples", `translate(${Math.sin(elapsed * 0.65) * 9} 0)`);
        transform(
          "sailboat",
          `translate(${851 - Math.sin(elapsed * 0.09) * 30} ${292 + Math.sin(elapsed * 1.2) * 1.5})`,
        );
        transform("breeze", `translate(${Math.sin(phase) * 7} 0)`);
        parts.breeze.setAttribute("opacity", String(0.45 + Math.sin(phase) * 0.2));
        parts["bike-shadow"].setAttribute("rx", String(236 + bob * 1.5));
        const blink = elapsed % 5.7;
        transform("eye", `translate(661 117) scale(1 ${blink > 5.5 ? 0.12 : 1})`);
      };
      const tick = (now) => {
        if (previousTime !== null) elapsed += Math.min((now - previousTime) / 1000, 0.05) * speed;
        previousTime = now;
        render();
        frameId = requestAnimationFrame(tick);
      };
      // 暂停或切到后台时停止调度；恢复时重置时间基准，避免画面跳跃。
      const schedule = () => {
        cancelAnimationFrame(frameId);
        previousTime = null;
        if (playing && !document.hidden) frameId = requestAnimationFrame(tick);
      };
      const updatePlayback = () => {
        playButton.classList.toggle("paused", !playing);
        playButton.setAttribute("aria-label", playing ? "暂停动画" : "播放动画");
        byId("ride-status").textContent = playing ? "自在骑行中" : "停下来，看看海";
        schedule();
      };
      playButton.addEventListener("click", () => {
        playing = !playing;
        updatePlayback();
      });
      speedInput.addEventListener("input", () => {
        speed = Number(speedInput.value);
        byId("speed-value").value = `${speed.toFixed(1)}×`;
        speedInput.setAttribute("aria-valuetext", `${speed.toFixed(1)} 倍速`);
      });
      byId("restart-button").addEventListener("click", () => {
        elapsed = 0;
        render();
        schedule();
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.code !== "Space" ||
          event.repeat ||
          event.target.closest("button, input, textarea, select, [contenteditable]")
        )
          return;
        event.preventDefault();
        playing = !playing;
        updatePlayback();
      });
      document.addEventListener("visibilitychange", schedule);
      motionPreference.addEventListener("change", (event) => {
        playing = !event.matches;
        updatePlayback();
      });
      render();
      updatePlayback();
    </script>
  </body>
</html>
